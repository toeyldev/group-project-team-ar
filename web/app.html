<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AisleVision — List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

<header class="app-header">
  <div class="app-header-inner">
    <span class="app-brand">AisleVision</span>
  </div>
</header>

<main class="app-main">
  <div class="app-card">
    <div class="app-card-head">
      <div>
        <h1 class="app-title">Grocery list</h1>
        <p class="app-subtitle" id="itemCount">0 items</p>
      </div>
    </div>

    <div class="add-row">
      <label class="visually-hidden" for="commonItemSelect">Choose an item to add</label>
      <select id="commonItemSelect" class="item-input common-item-select" title="Choose an item to add">
        <option value="">Choose an item…</option>
        <option value="Cup">Cup</option>
        <option value="Bottle">Bottle</option>
        <option value="Microwave">Microwave</option>
        <option value="Potted plant">Potted plant</option>
        <option value="Keyboard">Keyboard</option>
        <option value="Backpack">Backpack</option>
        <option value="Suitcase">Suitcase</option>
        <option value="Sports ball">Sports ball</option>
        <option value="Baseball bat">Baseball bat</option>
        <option value="Baseball glove">Baseball glove</option>
        <option value="Tennis racket">Tennis racket</option>
        <option value="Wine glass">Wine glass</option>
        <option value="Fork">Fork</option>
        <option value="Knife">Knife</option>
        <option value="Spoon">Spoon</option>
        <option value="Bowl">Bowl</option>
        <option value="Banana">Banana</option>
        <option value="Apple">Apple</option>
        <option value="Sandwich">Sandwich</option>
        <option value="Orange">Orange</option>
        <option value="Broccoli">Broccoli</option>
        <option value="Carrot">Carrot</option>
        <option value="Hot dog">Hot dog</option>
        <option value="Pizza">Pizza</option>
        <option value="Donut">Donut</option>
        <option value="Cake">Cake</option>
        <option value="Chair">Chair</option>
        <option value="Laptop">Laptop</option>
        <option value="Mouse">Mouse</option>
        <option value="Book">Book</option>
        <option value="Clock">Clock</option>
        <option value="Teddy bear">Teddy bear</option>
        <option value="Hair drier">Hair drier</option>
        <option value="Toothbrush">Toothbrush</option>
      </select>
    </div>

    <p class="app-status" id="appStatus" role="status" aria-live="polite"></p>
    <ul class="shopping-list" id="shoppingList"></ul>

    <div class="app-actions">
      <button type="button" class="btn-secondary" id="clearPickedBtn">Remove picked up</button>
      <button type="button" class="btn-secondary btn-strong" id="refreshBtn">Refresh now</button>
    </div>
  </div>
  <section class="app-card map-card" aria-labelledby="mapTitle">
    <div class="app-card-head"><div>
      <h2 id="mapTitle" class="app-title">Your store route</h2>
      <p class="app-subtitle">Target · San Jose West</p>
    </div></div>
    <div class="map-controls" aria-label="Map controls">
      <button type="button" class="btn-secondary" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" class="btn-secondary" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" class="btn-secondary" id="resetMap">Reset view</button>
      <button type="button" class="btn-secondary" id="newTrip">New trip · entrance</button>
    </div>
    <p class="app-subtitle map-help">Drag to pan · scroll or use +/− to zoom · arrow keys to pan</p>
    <svg id="storeMap" role="img" aria-label="Target floor plan with red shopping route" tabindex="0" preserveAspectRatio="xMidYMid meet" viewBox="0 0 492 540">
      <image id="storeMapImage" href="/assets/target-san-jose-west.png" width="492" height="540" />
      <g id="storeMapRoute"></g>
      <circle id="navigationStart" cx="96" cy="512" r="5" fill="#2563eb" stroke="white" stroke-width="2" />
      <text id="navigationStartLabel" x="104" y="504" class="map-label">Start · entrance</text>
    </svg>
    <p id="mapStatus" class="map-status" role="status" aria-live="polite">Loading map…</p>
  </section>
</main>

<script src="js/store-navigation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
